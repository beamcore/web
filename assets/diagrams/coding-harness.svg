<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="harness-title harness-desc">
  <title id="harness-title">Product Architecture: The Coding Harness</title>
  <desc id="harness-desc">Distributed Network connects Coding Agent Node A and Node B to Central Enterprise Ledger and Shared Memory Service.</desc>
  <defs>
    <filter id="shadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1098" height="718" rx="34" fill="#ffffff" stroke="#d8dde3"/>
  <rect x="48" y="44" width="1004" height="632" rx="30" fill="#f7f9fb"/>

  <g filter="url(#shadow)">
    <rect x="348" y="72" width="404" height="90" rx="24" fill="#111418"/>
    <text x="550" y="111" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700" font-size="24" fill="#ffffff">Distributed Network</text>
    <text x="550" y="140" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#d8dadc">single-binary or distributed microservices</text>
  </g>

  <path d="M550 176V220" stroke="#4648d4" stroke-width="5" stroke-linecap="round"/>
  <path d="M270 220H830" stroke="#4648d4" stroke-width="5" stroke-linecap="round"/>
  <path d="M270 220V256" stroke="#4648d4" stroke-width="5" stroke-linecap="round"/>
  <path d="M830 220V256" stroke="#4648d4" stroke-width="5" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <rect x="116" y="256" width="308" height="112" rx="24" fill="#ffffff" stroke="#c6c6cd"/>
    <text x="270" y="304" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700" font-size="24" fill="#191c1e">Coding Agent</text>
    <text x="270" y="335" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="17" fill="#45464d">(Node A)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="676" y="256" width="308" height="112" rx="24" fill="#ffffff" stroke="#c6c6cd"/>
    <text x="830" y="304" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700" font-size="24" fill="#191c1e">Coding Agent</text>
    <text x="830" y="335" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="17" fill="#45464d">(Node B)</text>
  </g>

  <path d="M270 386V424" stroke="#4648d4" stroke-width="5" stroke-linecap="round"/>
  <path d="M830 386V424" stroke="#4648d4" stroke-width="5" stroke-linecap="round"/>
  <path d="M270 424H830" stroke="#4648d4" stroke-width="5" stroke-linecap="round"/>
  <path d="M550 424V458" stroke="#4648d4" stroke-width="5" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <rect x="312" y="458" width="476" height="122" rx="24" fill="#ffffff" stroke="#c6c6cd"/>
    <text x="550" y="502" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700" font-size="24" fill="#191c1e">Central Enterprise Ledger</text>
    <text x="550" y="536" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" fill="#45464d">Cross-Organizational Tool Logging</text>
    <text x="550" y="562" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" fill="#45464d">Predictive System Analytics</text>
  </g>

  <path d="M312 620H284" stroke="#c6c6cd" stroke-width="4" stroke-linecap="round"/>
  <path d="M788 620H816" stroke="#c6c6cd" stroke-width="4" stroke-linecap="round"/>
  <path d="M550 580V620" stroke="#c6c6cd" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 10"/>

  <g filter="url(#shadow)">
    <rect x="78" y="558" width="206" height="112" rx="24" fill="#ffffff" stroke="#c6c6cd"/>
    <text x="181" y="599" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700" font-size="19" fill="#191c1e">Memory Service</text>
    <text x="181" y="630" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#45464d">Local Mode</text>
    <text x="181" y="654" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#45464d">Distributed Mode</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="816" y="558" width="206" height="112" rx="24" fill="#ffffff" stroke="#c6c6cd"/>
    <text x="919" y="597" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700" font-size="17" fill="#191c1e">Shared Memory Service</text>
    <text x="919" y="628" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#45464d">Team-Wide Context Synthesis</text>
    <text x="919" y="652" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#45464d">Distributed Knowledge Base</text>
  </g>
